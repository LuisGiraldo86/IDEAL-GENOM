# Reference copy of the bioconda-recipes submission for this project.
# The actual recipe lives at recipes/ideal-genom/meta.yaml in a fork of
# https://github.com/bioconda/bioconda-recipes — copy this file there when
# submitting or bumping the version.
{% set name = "ideal-genom" %}
{% set version = "1.3.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/ideal_genom-{{ version }}.tar.gz
  sha256: f2ba631529cb7b530cffa46efdf56c75da16182596bf554f92ec60d0e5ce60c0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  number: 0
  entry_points:
    - ideal-genom = ideal_genom.__main__:main

requirements:
  host:
    - python >=3.11,<3.13
    - pip
    - poetry-core >=1.5.0
  run:
    - python >=3.11,<3.13
    - pandas >=2.2.1,<3.0.0
    - matplotlib-base >=3.8.3,<4.0.0
    - seaborn >=0.13.2,<1.0.0
    - scipy >=1.12.0,<2.0.0
    - requests >=2.31.0,<3.0.0
    - psutil >=5.9.8,<6.0.0
    - umap-learn >=0.5.6,<1.0.0
    - jupyter >=1.1.1,<2.0.0
    - llvmlite >=0.43.0,<1.0.0
    - ipywidgets >=8.1.5,<9.0.0
    - pyyaml >=6.0,<7.0.0
    - gtfparse >=2.5.0,<3.0.0
    - pyensembl >=2.3.13,<3.0.0
    - numpy <2
    - textalloc >=1.2.1,<2.0.0
    - openpyxl >=3.1.5,<4.0.0
    - plink
    - plink2
    - gcta
    - bcftools

test:
  imports:
    - ideal_genom
  commands:
    - ideal-genom --version
    - pip check
  requires:
    - pip

about:
  home: https://github.com/LuisGiraldo86/IDEAL-GENOM
  summary: "Automated, reproducible genotype QC, post-imputation VCF processing, and GWAS pipelines wrapping PLINK/PLINK2/GCTA/bcftools"
  license: MIT
  license_file: LICENSE
  dev_url: https://github.com/LuisGiraldo86/IDEAL-GENOM

extra:
  recipe-maintainers:
    - LuisGiraldo86
